<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient warm ocre & emerald -->
    <linearGradient id="bgGradBouye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Bowl Ceramic Warm Clay -->
    <linearGradient id="bowlGradBouye" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Golden Corn Porridge Cream -->
    <radialGradient id="porridgeGradCorn" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Baobab Puree (Bouye) Velvet Swirl -->
    <radialGradient id="bouyePulp" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="softShadowBouye" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="450" fill="url(#bgGradBouye)"/>
  
  <!-- Subtle African Baobab & Solar Geometry -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="300" cy="225" r="190"/>
    <circle cx="300" cy="225" r="230"/>
    <path d="M300 35 L300 415 M110 225 L490 225"/>
    <polygon points="300,50 330,100 270,100"/>
    <polygon points="300,400 330,350 270,350"/>
  </g>

  <!-- Shadow Base -->
  <ellipse cx="300" cy="360" rx="190" ry="32" fill="#022c22" opacity="0.5" filter="url(#softShadowBouye)"/>

  <!-- Steaming Vapor Waves -->
  <g opacity="0.4" stroke="#fef9c3" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M260 135 Q250 95 270 65 Q285 40 275 15">
      <animate attributeName="d" dur="3.8s" repeatCount="indefinite"
        values="M260 135 Q250 95 270 65 Q285 40 275 15; M260 135 Q270 95 255 65 Q245 40 265 15; M260 135 Q250 95 270 65 Q285 40 275 15"/>
    </path>
    <path d="M330 130 Q345 90 325 60 Q315 35 335 15">
      <animate attributeName="d" dur="4.2s" repeatCount="indefinite"
        values="M330 130 Q345 90 325 60 Q315 35 335 15; M330 130 Q320 90 340 60 Q350 35 330 15; M330 130 Q345 90 325 60 Q315 35 335 15"/>
    </path>
  </g>

  <!-- Ceramic Bowl Outer Body -->
  <path d="M125 210 C130 330, 210 375, 300 375 C390 375, 470 330, 475 210 Z" fill="url(#bowlGradBouye)" filter="url(#softShadowBouye)"/>
  <!-- Rim Lip -->
  <ellipse cx="300" cy="210" rx="175" ry="48" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <ellipse cx="300" cy="210" rx="165" ry="43" fill="#fef08a"/>

  <!-- Corn Porridge Surface -->
  <ellipse cx="300" cy="214" rx="160" ry="40" fill="url(#porridgeGradCorn)"/>

  <!-- Baobab Pulp (Bouye) Creamy White Marbling -->
  <path d="M220 216 C250 238, 320 236, 360 215 C330 198, 260 200, 220 216 Z" fill="url(#bouyePulp)" opacity="0.9"/>
  <path d="M250 212 C280 226, 310 224, 335 212 Z" fill="#ffffff" opacity="0.8"/>

  <!-- Baobab Seeds & Natural Pulp Nodes -->
  <g fill="#78350f" stroke="#451a03" stroke-width="0.8">
    <ellipse cx="270" cy="218" rx="6" ry="4" transform="rotate(-15 270 218)"/>
    <ellipse cx="320" cy="222" rx="5.5" ry="3.8" transform="rotate(25 320 222)"/>
    <ellipse cx="350" cy="214" rx="5" ry="3.2" transform="rotate(10 350 214)"/>
    <ellipse cx="240" cy="212" rx="4.5" ry="3" transform="rotate(-30 240 212)"/>
  </g>

  <!-- Golden Roasted Peanut Butter Swirls -->
  <g fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M250 225 Q280 235 310 228"/>
    <path d="M290 220 Q325 228 355 218"/>
  </g>

  <!-- Wooden Ladle / Carved Spoon -->
  <g filter="url(#softShadowBouye)">
    <path d="M375 215 L495 322 C503 330, 515 327, 520 320 C525 312, 521 300, 511 292 L400 195 Z" fill="#b45309"/>
    <path d="M375 215 L495 322 C500 327, 509 324, 513 319 C517 314, 514 305, 507 299 L400 195 Z" fill="#d97706" opacity="0.8"/>
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(30, 30)">
    <rect width="195" height="34" rx="17" fill="#064e3b" opacity="0.9" stroke="#facc15" stroke-width="1.5"/>
    <text x="22" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#fef08a" letter-spacing="0.5">BOUILLIE MAÏS &amp; BOUYE</text>
  </g>

  <!-- Vitamin C Badge -->
  <g transform="translate(415, 30)">
    <rect width="155" height="34" rx="17" fill="#064e3b" opacity="0.9" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="22" cy="17" r="6" fill="#10b981"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">VITAMINE C + FER</text>
  </g>
</svg>
