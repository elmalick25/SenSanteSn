<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5341"/>
      <stop offset="40%" stop-color="#0f6b54"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>

    <!-- Bowl Ceramic Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Porridge (Suxu) Warm Golden Millet Cream -->
    <radialGradient id="porridgeGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>

    <!-- Peanut Oil Sheen -->
    <linearGradient id="oilSheen" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#042017" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Tribal Pattern Geometry -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="300" cy="225" r="180"/>
    <circle cx="300" cy="225" r="215"/>
    <circle cx="300" cy="225" r="250"/>
    <path d="M50 50 L120 50 L85 110 Z M520 380 L570 380 L545 420 Z"/>
    <path d="M480 60 L540 60 L510 110 Z M60 360 L110 360 L85 410 Z"/>
  </g>

  <!-- Bowl Shadow Base -->
  <ellipse cx="300" cy="360" rx="190" ry="32" fill="#031f16" opacity="0.5" filter="url(#softShadow)"/>

  <!-- Steaming Vapor Waves -->
  <g opacity="0.4" stroke="#e6f4ea" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M250 140 Q240 100 260 70 Q275 45 265 20">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M250 140 Q240 100 260 70 Q275 45 265 20; M250 140 Q260 100 245 70 Q235 45 255 20; M250 140 Q240 100 260 70 Q275 45 265 20"/>
    </path>
    <path d="M300 130 Q315 90 295 60 Q285 35 305 15">
      <animate attributeName="d" dur="3.5s" repeatCount="indefinite"
        values="M300 130 Q315 90 295 60 Q285 35 305 15; M300 130 Q290 90 310 60 Q320 35 300 15; M300 130 Q315 90 295 60 Q285 35 305 15"/>
    </path>
    <path d="M350 140 Q365 105 345 75 Q335 50 350 25">
      <animate attributeName="d" dur="4.2s" repeatCount="indefinite"
        values="M350 140 Q365 105 345 75 Q335 50 350 25; M350 140 Q340 105 360 75 Q370 50 345 25; M350 140 Q365 105 345 75 Q335 50 350 25"/>
    </path>
  </g>

  <!-- Ceramic Bowl Outer Body -->
  <path d="M125 210 C130 330, 210 375, 300 375 C390 375, 470 330, 475 210 Z" fill="url(#bowlGrad)" filter="url(#softShadow)"/>
  <!-- Bowl Rim Lip -->
  <ellipse cx="300" cy="210" rx="175" ry="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <ellipse cx="300" cy="210" rx="165" ry="43" fill="#e2e8f0"/>

  <!-- Porridge (Suxu Sounouf) Surface -->
  <ellipse cx="300" cy="214" rx="160" ry="40" fill="url(#porridgeGrad)"/>

  <!-- Golden Peanut Oil Swirl -->
  <path d="M210 215 C240 235, 350 238, 380 215 C350 200, 250 198, 210 215 Z" fill="url(#oilSheen)"/>
  <ellipse cx="280" cy="212" rx="40" ry="12" fill="#fef08a" opacity="0.6"/>

  <!-- Crushed Peanut Bits (Arachides pilées) -->
  <g fill="#d97706" stroke="#b45309" stroke-width="0.8">
    <ellipse cx="260" cy="222" rx="5" ry="3"/>
    <ellipse cx="275" cy="218" rx="6" ry="3.5" transform="rotate(20 275 218)"/>
    <ellipse cx="295" cy="225" rx="5.5" ry="3" transform="rotate(-15 295 225)"/>
    <ellipse cx="340" cy="216" rx="6" ry="3.2" transform="rotate(35 340 216)"/>
    <ellipse cx="325" cy="224" rx="4.5" ry="2.5"/>
    <ellipse cx="240" cy="214" rx="4" ry="2.5" transform="rotate(10 240 214)"/>
    <ellipse cx="360" cy="212" rx="5" ry="3" transform="rotate(-25 360 212)"/>
  </g>

  <!-- Fresh Moringa Leaves (Feuilles de Nébéday) -->
  <g fill="#15803d" stroke="#166534" stroke-width="0.8">
    <!-- Leaf cluster 1 -->
    <path d="M280 200 C270 190, 275 180, 285 185 C295 190, 290 205, 280 200 Z"/>
    <path d="M292 195 C298 185, 310 188, 308 198 C305 208, 295 202, 292 195 Z"/>
    <path d="M282 188 C285 178, 298 178, 296 188 C294 196, 285 194, 282 188 Z"/>
    <!-- Leaf cluster 2 -->
    <path d="M320 208 C315 200, 322 192, 330 196 C338 200, 330 212, 320 208 Z"/>
    <path d="M335 204 C342 198, 350 202, 348 210 C345 216, 336 212, 335 204 Z"/>
  </g>

  <!-- Wooden Spoon Resting on Bowl -->
  <g filter="url(#softShadow)">
    <path d="M370 215 L490 320 C498 328, 510 325, 515 318 C520 310, 516 298, 506 290 L395 195 Z" fill="#9a3412"/>
    <path d="M370 215 L490 320 C495 325, 504 322, 508 317 C512 312, 509 303, 502 297 L395 195 Z" fill="#b45309" opacity="0.8"/>
  </g>

  <!-- Title Pill Badge in SVG -->
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="17" fill="#064e3b" opacity="0.9" stroke="#34d399" stroke-width="1.5"/>
    <text x="24" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">SUXU SOUNOUF F2</text>
  </g>

  <!-- Certified Recipe Stamp -->
  <g transform="translate(420, 30)">
    <rect width="150" height="34" rx="17" fill="#064e3b" opacity="0.9" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="22" cy="17" r="6" fill="#f59e0b"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#fef08a">CNDN SÉNÉGAL</text>
  </g>
</svg>
